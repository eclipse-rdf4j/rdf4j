name: LMDB QEMU durability

on:
  pull_request:

permissions:
  contents: read

jobs:
  lmdb-qemu-durability:
    name: LMDB recovery and power cuts (QEMU KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QEMU x86_64, UEFI, and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf genisoimage acl libcap2-bin strace file util-linux
          command -v qemu-system-x86_64
          command -v qemu-img
          command -v genisoimage
          command -v setfacl
          command -v getfacl
          command -v getcap
          command -v strace
          command -v file
          command -v setsid
          command -v timeout
          test -s /usr/share/OVMF/OVMF_CODE_4M.fd
          test -s /usr/share/OVMF/OVMF_VARS_4M.fd
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Create isolated crashlab workspace
        run: |
          mkdir -p "$RUNNER_TEMP/rdf4j-lmdb-qemu/guest" "$RUNNER_TEMP/rdf4j-lmdb-qemu/campaigns"
          printf 'CRASHLAB_ROOT=%s\n' "$RUNNER_TEMP/rdf4j-lmdb-qemu" >> "$GITHUB_ENV"

      - name: Preflight KVM acceleration
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            printf 'KVM preflight failed: /dev/kvm is not a character device.\n' >&2
            exit 1
          fi
          runner_uid=$(id -u)
          runner_user=$(id -un)
          kvm_group=$(stat -c %G /dev/kvm)
          qemu_binary=$(command -v qemu-system-x86_64)
          [[ $runner_uid -ne 0 && -n $runner_user && -n $kvm_group ]] || {
            printf 'KVM preflight failed: expected an unprivileged runner user and named device group.\n' >&2
            exit 1
          }
          sudo setfacl --modify "u:$runner_uid:rw" /dev/kvm
          kvm_acl=$(getfacl --numeric --omit-header --absolute-names /dev/kvm)
          probe_root="$CRASHLAB_ROOT/kvm-preflight"
          [[ ! -e $probe_root && ! -L $probe_root ]] || {
            printf 'Refusing pre-existing KVM preflight directory: %s\n' "$probe_root" >&2
            exit 1
          }
          mkdir "$probe_root"
          printf '%s\n' "$kvm_acl" | tee "$probe_root/acl.txt"
          grep -Fx "user:$runner_uid:rw-" <<<"$kvm_acl"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            printf 'KVM preflight failed: job user still cannot read and write /dev/kvm after its user ACL was applied.\n' >&2
            ls -l /dev/kvm >&2
            exit 1
          fi
          qemu_wrapper="$CRASHLAB_ROOT/qemu-kvm"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec sudo -n -u %q -g %q -- %q "$@"\n' \
            "$runner_user" "$kvm_group" "$qemu_binary" > "$qemu_wrapper"
          chmod 0755 "$qemu_wrapper"
          capture_process_context() {
            local path=$1
            {
              printf 'captured_at=%s\n' "$(date --iso-8601=seconds)"
              printf 'probe_uid=%s probe_user=%s device_group=%s qemu_binary=%s\n' \
                "$(id -u)" "$(id -un)" "$kvm_group" "$qemu_binary"
              id -a
              stat -Lc 'device=%A %U:%G mode=%a major_minor=%t:%T path=%n' /dev/kvm
              getfacl --numeric --absolute-names /dev/kvm
              stat -Lc 'qemu=%A %U:%G mode=%a path=%n' "$qemu_binary"
              file "$qemu_binary"
              getcap "$qemu_binary" || true
            } > "$path" 2>&1
          }
          capture_group_context() {
            local path=$1
            sudo -n -u "$runner_user" -g "$kvm_group" -- bash -c '
              id -a
              stat -Lc "device=%A %U:%G mode=%a major_minor=%t:%T path=%n" /dev/kvm
              getfacl --numeric --absolute-names /dev/kvm
              stat -Lc "qemu=%A %U:%G mode=%a path=%n" "$1"
              file "$1"
              getcap "$1" || true
            ' _ "$qemu_binary" > "$path" 2>&1
          }
          collect_security_context() {
            local directory=$1
            local since=$2
            if sudo -n test -r /sys/kernel/security/apparmor/profiles; then
              if ! sudo -n cat /sys/kernel/security/apparmor/profiles \
                  > "$directory/apparmor-profiles.txt" 2>&1; then
                printf 'AppArmor profile list could not be read.\n' \
                  >> "$directory/apparmor-profiles.txt"
              fi
            else
              printf 'AppArmor profile list unavailable.\n' > "$directory/apparmor-profiles.txt"
            fi
            timeout 5s sudo -n journalctl -k --since "$since" --no-pager 2>&1 \
              | grep -Ei 'apparmor|audit.*denied|denied.*(qemu|/dev/kvm)' \
              > "$directory/kernel-denials.txt" || true
            [[ -s $directory/kernel-denials.txt ]] || \
              printf 'No matching recent kernel denial record was available.\n' \
                > "$directory/kernel-denials.txt"
            if sudo -n test -r /var/log/audit/audit.log; then
              timeout 5s sudo -n tail -n 500 /var/log/audit/audit.log 2>&1 \
                | grep -Ei 'apparmor="DENIED"|audit.*denied|denied.*(qemu|/dev/kvm)' \
                > "$directory/audit-denials.txt" || true
              [[ -s $directory/audit-denials.txt ]] || \
                printf 'No matching recent audit denial record was available.\n' \
                  > "$directory/audit-denials.txt"
            else
              printf 'Audit log file unavailable.\n' > "$directory/audit-denials.txt"
            fi
          }
          capture_process_context "$probe_root/kvm-api-context.txt"
          printf 'runner uid=%s user=%s device group=%s\n' \
            "$runner_uid" "$runner_user" "$kvm_group" | tee "$probe_root/result.txt"
          python3 - <<'PY' | tee -a "$probe_root/result.txt"
          import fcntl
          import os

          # KVMIO is 0xAE; these are _IO(KVMIO, 0x00/0x01) from Linux KVM.
          KVM_GET_API_VERSION = 0xAE00
          KVM_CREATE_VM = 0xAE01
          device_fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          try:
              api_version = fcntl.ioctl(device_fd, KVM_GET_API_VERSION, 0)
              if api_version != 12:
                  raise RuntimeError(f"unsupported KVM API version: {api_version}")
              vm_fd = fcntl.ioctl(device_fd, KVM_CREATE_VM, 0)
              try:
                  print(f"KVM API {api_version}; created test VM fd {vm_fd}")
              finally:
                  os.close(vm_fd)
          finally:
              os.close(device_fd)
          PY
          printf 'KVM API preflight passed for uid=%s user=%s group=%s.\n' \
            "$runner_uid" "$runner_user" "$kvm_group" | tee -a "$probe_root/result.txt"
          direct_context="$probe_root/direct-user-context.txt"
          capture_process_context "$direct_context"
          capture_qmp_quit() {
            python3 - "$1" <<'PY'
          import json
          import socket
          import sys

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(3)
          sock.connect(sys.argv[1])
          stream = sock.makefile("rwb", buffering=0)
          greeting = json.loads(stream.readline())
          if "QMP" not in greeting:
              raise RuntimeError(f"unexpected QMP greeting: {greeting}")
          stream.write(b'{"execute":"qmp_capabilities"}\r\n')
          response = json.loads(stream.readline())
          if "return" not in response:
              raise RuntimeError(f"QMP capability negotiation failed: {response}")
          stream.write(b'{"execute":"quit"}\r\n')
          stream.close()
          sock.close()
          PY
          }
          probe_pid=
          probe_qmp=
          probe_state() {
            ps -o stat= -p "$1" 2>/dev/null | tr -d '[:space:]'
          }
          stop_probe() {
            local pid=${probe_pid:-}
            [[ -n $pid ]] || return 0
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 40); do
              local state
              state=$(probe_state "$pid")
              if [[ -z $state || $state == Z* ]]; then
                wait "$pid" 2>/dev/null || true
                probe_pid=
                return 0
              fi
              sleep 0.05
            done
            kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            probe_pid=
          }
          wait_probe_exit() {
            local pid=$1
            local state
            for _ in $(seq 1 100); do
              state=$(probe_state "$pid")
              if [[ -z $state || $state == Z* ]]; then
                set +e
                wait "$pid"
                local status=$?
                set -e
                probe_pid=
                return "$status"
              fi
              sleep 0.05
            done
            return 124
          }
          cleanup_probe() {
            if [[ -n "${probe_pid:-}" ]]; then
              if [[ -S ${probe_qmp:-} ]]; then
                capture_qmp_quit "$probe_qmp" >/dev/null 2>&1 || true
              fi
              stop_probe
            fi
          }
          trap cleanup_probe EXIT
          run_qemu_probe() {
            local label=$1
            local required=$2
            shift 2
            local directory="$probe_root/$label"
            local start_time
            local probe_log="$directory/qemu.log"
            probe_qmp="$directory/qmp.sock"
            mkdir "$directory"
            if [[ $label == primary-group ]]; then
              capture_group_context "$directory/process-context.txt"
            else
              capture_process_context "$directory/process-context.txt"
            fi
            start_time=$(date --iso-8601=seconds)
            setsid "$@" \
              -machine q35,accel=kvm -cpu host -m 64 -nodefaults \
              -display none -S -monitor none -serial none \
              -qmp "unix:$probe_qmp,server=on,wait=off" \
              >"$probe_log" 2>&1 &
            probe_pid=$!
            for _ in $(seq 1 100); do
              if [[ -S $probe_qmp ]]; then
                break
              fi
              if ! kill -0 "$probe_pid" 2>/dev/null; then
                set +e
                wait "$probe_pid"
                probe_status=$?
                set -e
                probe_pid=
                collect_security_context "$directory" "$start_time"
                printf 'QEMU %s diagnostic exited before QMP became ready (status %s).\n' \
                  "$label" "$probe_status" | tee -a "$probe_root/result.txt"
                if [[ $required == true ]]; then
                  cat "$probe_log" >&2
                  cat "$directory/kernel-denials.txt" >&2
                  return 1
                fi
                return 0
              fi
              sleep 0.05
            done
            if [[ ! -S $probe_qmp ]]; then
              collect_security_context "$directory" "$start_time"
              printf 'QEMU %s diagnostic did not expose QMP within 5 seconds.\n' "$label" \
                | tee -a "$probe_root/result.txt"
              cat "$probe_log" >&2
              stop_probe
              if [[ $required == true ]]; then
                cat "$directory/kernel-denials.txt" >&2
                return 1
              fi
              return 0
            fi
            sleep 2
            probe_state_now=$(probe_state "$probe_pid")
            if [[ -z $probe_state_now || $probe_state_now == Z* ]]; then
              set +e
              wait "$probe_pid"
              probe_status=$?
              set -e
              probe_pid=
              collect_security_context "$directory" "$start_time"
              printf 'QEMU %s diagnostic exited during the paused KVM check (status %s).\n' \
                "$label" "$probe_status" | tee -a "$probe_root/result.txt"
              if [[ $required == true ]]; then
                cat "$probe_log" >&2
                return 1
              fi
              return 0
            fi
            capture_qmp_quit "$probe_qmp"
            set +e
            wait_probe_exit "$probe_pid"
            probe_status=$?
            set -e
            if [[ $probe_status -ne 0 ]]; then
              stop_probe
              collect_security_context "$directory" "$start_time"
              printf 'QEMU %s diagnostic failed while shutting down (status %s).\n' \
                "$label" "$probe_status" | tee -a "$probe_root/result.txt"
              if [[ $required == true ]]; then
                cat "$probe_log" >&2
                return 1
              fi
              return 0
            fi
            probe_pid=
            collect_security_context "$directory" "$start_time"
            printf 'QEMU %s KVM probe passed; QMP stayed responsive for 2 seconds.\n' "$label" \
              | tee -a "$probe_root/result.txt"
          }
          run_qemu_probe direct-user false \
            strace -f -yy -e trace=%file -o "$probe_root/direct-user/open.trace" "$qemu_binary"
          run_qemu_probe primary-group true "$qemu_wrapper"
          probe_qmp=
          trap - EXIT

      - name: Build exact Java 25 artifacts
        run: mvn -B -ntp -T 1C -Dmaven.repo.local=.m2_repo -Pquick clean install

      - name: Run required LMDB recovery and isolation tests
        run: >-
          mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb
          -Dtest=LmdbCrashRecoveryTest,LmdbStoreFlushReproductionTest,TripleStoreAutoGrowTest,ValueStoreTermIndexRecoveryTest,LmdbConstructorCleanupTest,PersistentSetFactoryTransactionOwnershipTest,LmdbSnapshotValueLifetimeTest,LmdbValueRetirementRecoveryTest,TxnMutationJournalTest
          -Dit.test=LmdbStoreModelLifecycleIT verify

      - name: Preserve Maven test reports
        if: always()
        run: |
          if [[ -z "${CRASHLAB_ROOT:-}" ]]; then
            printf 'Crashlab workspace was not initialized; Maven reports cannot be copied.\n'
            exit 0
          fi
          mkdir -p "$CRASHLAB_ROOT/maven"
          for report_dir in core/sail/lmdb/target/surefire-reports core/sail/lmdb/target/failsafe-reports; do
            if [[ -d "$report_dir" ]]; then
              cp -a "$report_dir" "$CRASHLAB_ROOT/maven/"
            else
              printf 'missing report directory: %s\n' "$report_dir" \
                >> "$CRASHLAB_ROOT/maven/missing-report-directories.txt"
            fi
          done

      - name: Check crashlab Python harness
        run: scripts/lmdb-crashlab/run-tests.sh

      - name: Capture exact Linux x86_64 test classpath
        run: |
          mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile="$CRASHLAB_ROOT/host-dependencies.txt"
          printf '%s:' "$GITHUB_WORKSPACE/core/sail/lmdb/target/test-classes" \
            "$GITHUB_WORKSPACE/core/sail/lmdb/target/classes" > "$CRASHLAB_ROOT/host-classpath.txt"
          tr -d '\n' < "$CRASHLAB_ROOT/host-dependencies.txt" >> "$CRASHLAB_ROOT/host-classpath.txt"
          printf '\n' >> "$CRASHLAB_ROOT/host-classpath.txt"
          grep -q 'lwjgl-lmdb-[^:]*-natives-linux.jar' "$CRASHLAB_ROOT/host-classpath.txt"

      - name: Provision disposable Ubuntu x86_64 Java 25 guest
        run: |
          bash scripts/lmdb-crashlab/provision-linux-guest.sh \
            "$CRASHLAB_ROOT/guest" \
            "$CRASHLAB_ROOT/qemu-kvm" \
            "$(command -v qemu-img)" \
            "$(command -v genisoimage)" \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            x86_64 kvm

      - name: Run calibrated LMDB recovery and power-cut campaigns
        run: |
          python3 scripts/lmdb-crashlab/run_ci_campaigns.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --scratch-root "$CRASHLAB_ROOT/campaigns" \
            --os-base-image "$CRASHLAB_ROOT/guest/ubuntu-x86_64-java25.qcow2" \
            --firmware-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --firmware-vars-template /usr/share/OVMF/OVMF_VARS_4M.fd \
            --qemu "$CRASHLAB_ROOT/qemu-kvm" \
            --qemu-img "$(command -v qemu-img)" \
            --genisoimage "$(command -v genisoimage)" \
            --host-classpath-file "$CRASHLAB_ROOT/host-classpath.txt" \
            --machine q35 --accel kvm --cpu host --native-classifier linux \
            --port-base 23000

      - name: Reject skipped Java tests and incomplete campaign reports
        run: |
          python3 scripts/lmdb-crashlab/ci_gate.py \
            --calibration-report "$CRASHLAB_ROOT/campaigns/calibration/results/ext4-crash-calibration-report.json" \
            --namespace-report "$CRASHLAB_ROOT/campaigns/namespace/results/actual-campaign-report.json" \
            --powercut-report "$CRASHLAB_ROOT/campaigns/mixed-replay-before-native-commit/results/actual-powercut-campaign-report.json" \
            --powercut-report "$CRASHLAB_ROOT/campaigns/dictionary-before-triple-commit/results/actual-powercut-campaign-report.json" \
            --powercut-report "$CRASHLAB_ROOT/campaigns/commit-returned-before-ack/results/actual-powercut-campaign-report.json" \
            --surefire-dir core/sail/lmdb/target/surefire-reports \
            --failsafe-dir core/sail/lmdb/target/failsafe-reports \
            --summary-json "$CRASHLAB_ROOT/campaigns/ci-gate-summary.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve guest, campaign, and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmdb-qemu-durability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rdf4j-lmdb-qemu/**
            !${{ runner.temp }}/rdf4j-lmdb-qemu/guest/image/ubuntu-24.04-server-cloudimg-amd64.img
            !${{ runner.temp }}/rdf4j-lmdb-qemu/guest/ubuntu-x86_64-java25.qcow2
            !${{ runner.temp }}/rdf4j-lmdb-qemu/guest/firmware-vars.fd
            !${{ runner.temp }}/rdf4j-lmdb-qemu/guest/seed.iso
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
