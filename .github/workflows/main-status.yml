name: main status

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 25 ]

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Register JVM thread dump on cancel
      uses: ./.github/actions/thread-dump-post
    - name: Set up JDK
      uses: actions/setup-java@v6.0.1
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
    - name: Cache local Maven repository
      uses: actions/cache@v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-jdk${{ matrix.jdk }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-jdk${{ matrix.jdk }}-maven-
    - name: Build
      run: mvn -B -U -T 2C clean install -DskipTests -DskipITs
    - name: Run all tests
      run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B --fail-at-end install -P-skipSlowTests -Dmaven.javadoc.skip=true
    - name: Publish Test Report
      if: failure()
      uses: ScalableCapital/action-surefire-report@v2.0.5
      with:
        check_name: Test report - main status - ${{ matrix.jdk }}

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          tools/workbench/package-lock.json
          e2e/package-lock.json
    - name: Build the Workbench front end
      working-directory: ./tools/workbench
      run: npm ci && npm run build
    - name: Type-check the Workbench front end
      working-directory: ./tools/workbench
      run: npm run typecheck
    - name: Run Workbench front-end unit tests
      working-directory: ./tools/workbench
      env:
        # The classic pages' and the graph explorer's tests; runners are slower than the layout budgets assume.
        GRAPH_PERFORMANCE_SLOWDOWN: 3
      run: npm test
    - name: Install e2e dependencies
      working-directory: ./e2e
      run: npm ci
    - name: Run e2e helper unit tests
      working-directory: ./e2e
      run: npm run test:unit
