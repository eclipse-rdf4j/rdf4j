name: develop status

on:
  push:
    branches:
      - develop

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 25 ]

    steps:
    - uses: actions/checkout@v4
    - name: Register JVM thread dump on cancel
      uses: ./.github/actions/thread-dump-post
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-jdk${{ matrix.jdk }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-jdk${{ matrix.jdk }}-maven-
    - name: Build
      run: mvn -B -U clean install -Pquick,\!formatting
    - name: Verify
      run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B install -P-skipSlowTests -Dmaven.javadoc.skip=true
    - name: Publish Test Report
      if: failure()
      uses: scacap/action-surefire-report@v1
      with:
        check_name: Test report - develop status - ${{ matrix.jdk }}

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          tools/workbench/package-lock.json
          e2e/package-lock.json
    - name: Build the Workbench front end
      working-directory: ./tools/workbench
      run: npm ci && npm run build
    - name: Run Workbench front-end unit tests
      working-directory: ./tools/workbench
      run: npm run test:classic
    - name: Install e2e dependencies
      working-directory: ./e2e
      run: npm ci
    - name: Run e2e helper unit tests
      working-directory: ./e2e
      run: npm run test:unit
