name: RDF parser query extensions

on:
  pull_request:
    paths:
      - '.github/workflows/rdf-parser-query-extensions.yml'
      - 'compliance/rdf-parser/**'
      - 'core/sail/base/**'
      - 'core/sail/lmdb/**'
      - 'core/repository/sail/**'
      - 'tools/federation/**'
      - 'core/rio/api/**'
      - 'core/rio/turtle/**'
      - 'core/rio/trig/**'
      - 'core/rio/ntriples/**'
      - 'core/rio/nquads/**'
      - 'core/queryalgebra/evaluation/**'
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Measure the current implementation with JMH'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rdf-parser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI can fetch its initially empty local Maven repository.
  MVN_OFFLINE: 'false'
  MAVEN_ARGS: -ntp -Dformatter.skip=true -Dimpsort.skip=true -Dspotless.skip=true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - name: Build and verify module, Rio and evaluator
        shell: bash
        run: bash compliance/rdf-parser/verify.sh
      - name: Measure current implementation with JMH
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        shell: bash
        run: bash compliance/rdf-parser/benchmark.sh
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdf-parser-verification
          path: |
            maven-build.log
            logs/rdf-parser-integration/
            compliance/rdf-parser/target/surefire-reports/
            core/rio/*/target/surefire-reports/
            core/queryalgebra/evaluation/target/surefire-reports/
            compliance/rdf-parser/target/benchmarks/
            tools/federation/target/surefire-reports/
