name: PR verify

on: pull_request

permissions:
  contents: read          # checkout & other read‑only operations
  actions: write          # allows the cancel‑workflow step to call the Actions API

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  formatting-and-quick-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Check formatting
        run: mvn -B -Pformatting spotless:check
      - name: Check SPARQL AST patches
        run: python3 scripts/manage-sparql-ast.py --check --online
      - name: Quick compile
        run: mvn -B --quiet -T 2C compile -DskipTests -Pquick
      - name: Download all other dependencies
        run: mvn -B --quiet -T 2C dependency:go-offline
      - name: Verify Maven test partition behavior
        run: python3 scripts/ci/verify_pr_verify_partitions.py --no-offline

  compile:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Compile (mvn clean install)
        run: mvn -B clean install -DskipTests -DskipITs


  build:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: true
      matrix:
        jdk: [ 25 ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn --quiet clean && mvn -B --quiet -T 2C install -Pquick
      - name: Test
        run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B test -DskipITs -PskipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip
      - name: Publish Test Report
        if: failure()
        uses: ScalableCapital/action-surefire-report@v2.0.5
        with:
          check_name: Test report - build - ${{ matrix.jdk }}
          # Read-only fork and Dependabot tokens retain parsed failure details in the action log.
          skip_publishing: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}


  integration-tests:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn --quiet clean && mvn -B --quiet -T 2C install -Pquick
      - name: Verify
        run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B verify -PskipUnitTests,skipSlowTests,-formatting -Dmaven.javadoc.skip -Denforcer.skip -Danimal.sniffer.skip
      - name: Publish Test Report
        if: failure()
        uses: ScalableCapital/action-surefire-report@v2.0.5
        with:
          check_name: Test report - integration-tests
          skip_publishing: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}

  slow-tests:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn --quiet clean && mvn -B --quiet -T 2C install -Pquick
      - name: Verify
        run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B verify -PslowTestsOnly,-skipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip
      - name: Publish Test Report
        if: failure()
        uses: ScalableCapital/action-surefire-report@v2.0.5
        with:
          check_name: Test report - slow-tests
          skip_publishing: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}

  package-assembly:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Run install
        run: mvn --quiet clean && mvn -B --quiet -T 2C install -Pquick
      - name: Package assembly
        run: mvn package -Passembly -DskipTests


  e2e:
    # Each browser runs on its own runner: the suite stays serial within a job, and the jobs run at the same time.
    name: e2e (${{ matrix.runtime.label }}, ${{ matrix.browser }})
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - label: Spring Boot
            argument: spring-boot
          - label: Docker Tomcat
            argument: docker-tomcat
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils xvfb
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Run end-to-end tests of RDF4J Server and Workbench (${{ matrix.runtime.label }}, ${{ matrix.browser }})
        id: e2e
        working-directory: ./e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: exec ../scripts/ci/run-with-thread-dump.sh ./run.sh ${{ matrix.runtime.argument }}
      - name: Upload Playwright failure diagnostics (${{ matrix.runtime.label }}, ${{ matrix.browser }})
        if: ${{ (failure() && steps.e2e.outcome == 'failure') || hashFiles('e2e/test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-diagnostics-${{ matrix.runtime.argument }}-${{ matrix.browser }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  frontend-unit-tests:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/workbench/package-lock.json
            e2e/package-lock.json
      - name: Build the Workbench front end
        working-directory: ./tools/workbench
        run: npm ci && npm run build
      - name: Type-check the Workbench front end
        working-directory: ./tools/workbench
        run: npm run typecheck
      - name: Run Workbench front-end unit tests
        working-directory: ./tools/workbench
        env:
          # The classic pages' and the graph explorer's tests; runners are slower than the layout budgets assume.
          GRAPH_PERFORMANCE_SLOWDOWN: 3
        run: npm test
      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Run e2e helper unit tests
        working-directory: ./e2e
        run: npm run test:unit

  copyright-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: check copyright header present
        run: scripts/checkCopyrightPresent.sh
