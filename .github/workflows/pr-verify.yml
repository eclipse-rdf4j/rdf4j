name: PR verify

on: pull_request

permissions:
  contents: read          # checkout & other read‑only operations
  actions: write          # allows the cancel‑workflow step to call the Actions API

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  formatting-and-quick-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Check formatting
        run: mvn -B -Pformatting spotless:check --fail-at-end
      - name: Check SPARQL AST patches
        run: python3 scripts/manage-sparql-ast.py --check --online
      - name: Quick compile
        run: mvn -B --quiet -T 2C compile --fail-at-end -DskipTests -Pquick
      - name: Download all other dependencies
        run: mvn -B --quiet -T 2C dependency:go-offline --fail-at-end
      - name: Verify Maven test partition behavior
        run: python3 scripts/ci/verify_pr_verify_partitions.py --no-offline

  compile:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Compile (mvn clean install)
        run: mvn -B clean install --fail-at-end -DskipTests -DskipITs


  build:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: true
      matrix:
        jdk: [ 25 ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn --quiet clean --fail-at-end && mvn -B --quiet -T 2C install --fail-at-end -Pquick
      - name: Test
        id: test
        run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B --fail-at-end test -DskipITs -PskipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip
      - name: Preserve LMDB JVM crash diagnostics
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/rdf4j-lmdb-jvm-diagnostics"
          mkdir -p "$diagnostics"

          for report_type in surefire failsafe; do
            report_dir="core/sail/lmdb/target/${report_type}-reports"
            if [[ -d "$report_dir" ]]; then
              destination="$diagnostics/${report_type}-reports"
              mkdir -p "$destination"
              find "$report_dir" -maxdepth 1 -type f \
                \( -name 'TEST-*.xml' -o -name '*.txt' -o -name '*.dump' -o -name '*.dumpstream' \) \
                -exec cp -- {} "$destination/" \;
            else
              printf 'Missing report directory: %s\n' "$report_dir" >> "$diagnostics/collection.txt"
            fi
          done

          mkdir -p "$diagnostics/hotspot"
          for crash_root in . core/sail/lmdb; do
            find "$crash_root" -maxdepth 1 -type f -name 'hs_err_pid*.log' \
              -exec cp -- {} "$diagnostics/hotspot/" \;
          done

          {
            printf 'core_pattern='
            cat /proc/sys/kernel/core_pattern 2>/dev/null || true
            printf 'core_size_limit='
            ulimit -c || true
            if command -v coredumpctl >/dev/null 2>&1; then
              if timeout 10s coredumpctl list --no-pager --no-legend 2>&1 | tail -n 20; then
                printf 'coredumpctl_pipeline_exit=0\n'
              else
                printf 'coredumpctl_pipeline_exit=%s\n' "$?"
              fi
            else
              printf 'coredumpctl unavailable\n'
            fi
            # Record core-file metadata only; never copy core binaries into the artifact.
            for core_root in . core/sail/lmdb; do
              find "$core_root" -maxdepth 1 -type f \
                \( -name core -o -name 'core.*' \) -printf '%p %s bytes\n' 2>/dev/null || true
            done
          } > "$diagnostics/core-metadata.txt" 2>&1
      - name: Upload LMDB JVM crash diagnostics
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lmdb-jvm-diagnostics-${{ github.run_id }}-${{ matrix.jdk }}
          path: ${{ runner.temp }}/rdf4j-lmdb-jvm-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
      - name: Publish Test Report
        if: failure()
        uses: ScalableCapital/action-surefire-report@v2.0.5
        with:
          check_name: Test report - build - ${{ matrix.jdk }}
          # Read-only fork and Dependabot tokens retain parsed failure details in the action log.
          skip_publishing: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}


  integration-tests:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn --quiet clean --fail-at-end && mvn -B --quiet -T 2C install --fail-at-end -Pquick
      - name: Verify
        run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B --fail-at-end verify -PskipUnitTests,skipSlowTests,-formatting -Dmaven.javadoc.skip -Denforcer.skip -Danimal.sniffer.skip
      - name: Publish Test Report
        if: failure()
        uses: ScalableCapital/action-surefire-report@v2.0.5
        with:
          check_name: Test report - integration-tests
          skip_publishing: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}

  slow-tests:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn --quiet clean --fail-at-end && mvn -B --quiet -T 2C install --fail-at-end -Pquick
      - name: Verify
        run: exec ./scripts/ci/run-with-thread-dump.sh mvn -B --fail-at-end verify -PslowTestsOnly,-skipSlowTests,-formatting -Dmaven.javadoc.skip -Djapicmp.skip -Denforcer.skip -Danimal.sniffer.skip
      - name: Publish Test Report
        if: failure()
        uses: ScalableCapital/action-surefire-report@v2.0.5
        with:
          check_name: Test report - slow-tests
          skip_publishing: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}

  package-assembly:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Run install
        run: mvn --quiet clean --fail-at-end && mvn -B --quiet -T 2C install --fail-at-end -Pquick
      - name: Package assembly
        run: mvn package --fail-at-end -Passembly -DskipTests


  e2e:
    # Each browser runs on its own runner: the suite stays serial within a job, and the jobs run at the same time.
    name: e2e (${{ matrix.runtime.label }}, ${{ matrix.browser }})
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - label: Spring Boot
            argument: spring-boot
          - label: Docker Tomcat
            argument: docker-tomcat
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils xvfb
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Run end-to-end tests of RDF4J Server and Workbench (${{ matrix.runtime.label }}, ${{ matrix.browser }})
        id: e2e
        working-directory: ./e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: exec ../scripts/ci/run-with-thread-dump.sh ./run.sh ${{ matrix.runtime.argument }}
      - name: Upload Playwright failure diagnostics (${{ matrix.runtime.label }}, ${{ matrix.browser }})
        if: ${{ (failure() && steps.e2e.outcome == 'failure') || hashFiles('e2e/test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-diagnostics-${{ matrix.runtime.argument }}-${{ matrix.browser }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  frontend-unit-tests:
    needs: formatting-and-quick-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/workbench/package-lock.json
            e2e/package-lock.json
      - name: Build the Workbench front end
        working-directory: ./tools/workbench
        run: npm ci && npm run build
      - name: Type-check the Workbench front end
        working-directory: ./tools/workbench
        run: npm run typecheck
      - name: Run Workbench front-end unit tests
        working-directory: ./tools/workbench
        env:
          # The classic pages' and the graph explorer's tests; runners are slower than the layout budgets assume.
          GRAPH_PERFORMANCE_SLOWDOWN: 3
        run: npm test
      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Run e2e helper unit tests
        working-directory: ./e2e
        run: npm run test:unit

  copyright-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Register JVM thread dump on cancel
        uses: ./.github/actions/thread-dump-post
      - name: check copyright header present
        run: scripts/checkCopyrightPresent.sh
