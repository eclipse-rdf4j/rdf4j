name: Test Hugo site

on:
  pull_request:
    paths:
      - ".github/workflows/hugo-test.yml"
      - ".github/workflows/hugo.yml"
      - ".gitmodules"
      - "site/**"
      - "scripts/update-javadoc-indexes.sh"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hugo-test.yml"
      - ".github/workflows/hugo.yml"
      - ".gitmodules"
      - "site/**"
      - "scripts/update-javadoc-indexes.sh"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Uncompress Javadoc
        working-directory: site/static/javadoc
        run: bash uncompress.sh

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Test Hugo site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          HUGO_TEST_OUTPUT_DIR: ${{ runner.temp }}/hugo_site
          HUGO_TEST_BASE_URL: https://rdf4j.org/
        run: bash site/tests/site-build.sh
