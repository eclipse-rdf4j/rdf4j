name: LMDB mapped pages

on:
  pull_request:
    paths:
      - 'core/sail/lmdb/**'
      - '.github/workflows/lmdb-mapped-pages.yml'
      - '.github/actions/jvm-diagnostics/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mapped-pages:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Enable JVM crash diagnostics
        uses: ./.github/actions/jvm-diagnostics
        with:
          mode: setup
      - name: Install LMDB and upstream artifacts
        run: mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb -am -Pquick install --fail-at-end
      - name: Verify mapping and resize regressions
        run: mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb "-Dtest=LmdbDataFileNativeMapTest,LmdbDataFileHeaderBufferTest,LmdbMappingAnchorTest,LmdbPageMappingLifecycleTest,LmdbPageCardinalityEstimatorDupSortNativeTest,TripleStoreInitializationTest,TripleStoreAutoGrowTest#testPageEstimatorAcrossAutoGrowth,TripleStoreAutoGrowTest#testPageEstimatorAfterCachedWriteFlushGrowth" -DskipITs verify --fail-at-end
      - name: Upload JVM crash diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/jvm-diagnostics
        with:
          mode: upload
          artifact-name: jvm-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}

