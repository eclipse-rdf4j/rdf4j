name: LMDB mapped pages

on:
  pull_request:
    paths:
      - 'core/sail/lmdb/**'
      - '.github/workflows/lmdb-mapped-pages.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mapped-pages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install LMDB and upstream artifacts
        run: mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb -am -Pquick install
      - name: Verify mapping and resize regressions
        run: mvn -B -ntp -Dmaven.repo.local=.m2_repo -pl core/sail/lmdb "-Dtest=LmdbDataFileNativeMapTest,LmdbMappingAnchorTest,LmdbPageMappingLifecycleTest,LmdbPageCardinalityEstimatorDupSortNativeTest,TripleStoreAutoGrowTest#testPageEstimatorAcrossAutoGrowth" -DskipITs verify
