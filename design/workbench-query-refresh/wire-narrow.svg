<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1320" viewBox="0 0 390 1320" role="img" aria-labelledby="title desc">
  <title id="title">RDF4J Workbench query page narrow wire</title>
  <desc id="desc">Collapsed Concept A narrow layout with wrapped header and navigation, full-width stacked islands, wrapping controls, and table overflow inside the result surface.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .muted { fill: #475569; } .small { font-size: 11px; } .label { font-size: 13px; font-weight: 700; }
    .rule { stroke: #cbd5e1; stroke-width: 1; } .island { fill: #fff; stroke: #e2e8f0; stroke-width: 1; } .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .primary { fill: #0f172a; } .logo { fill: #f97316; } .blue { fill: #2563eb; } .inverse { fill: #fff; }
    text[fill="#fff"] { fill: #fff; }
  </style>
  <rect width="390" height="1320" fill="#f1f5f9"/>
  <rect width="390" height="112" class="island"/><rect x="14" y="14" width="30" height="34" rx="7" class="logo"/><text x="54" y="38" font-size="21" font-weight="700">rdf4j / workbench</text><text x="14" y="69" class="small muted">RDF4J Server: http://127.0.0.1:8080</text><text x="14" y="87" class="small muted">Repository: Embedded results browser</text><text x="14" y="103" class="small muted">User (optional): - none -</text>
  <rect x="12" y="126" width="366" height="218" rx="14" class="island"/><text x="28" y="154" class="label">RDF4J SERVER</text><line x1="28" y1="162" x2="362" y2="162" class="rule"/><text x="28" y="184" class="small muted">Repositories</text><text x="28" y="206" class="small muted">New repository</text><text x="28" y="228" class="small muted">Delete repository</text><text x="28" y="252" class="label">EXPLORE</text><line x1="28" y1="260" x2="362" y2="260" class="rule"/><text x="28" y="282" class="small muted">Summary</text><text x="92" y="282" class="small muted">Namespaces</text><text x="178" y="282" class="small muted">Contexts</text><text x="252" y="282" class="small muted">Types</text><rect x="22" y="292" width="54" height="28" rx="8" fill="#e2e8f0"/><rect x="22" y="292" width="3" height="28" fill="#334155"/><text x="36" y="310" class="small" font-weight="700">Query</text><text x="92" y="310" class="small muted">Saved Queries</text><text x="200" y="310" class="small muted">Export</text>
  <text x="14" y="382" font-size="24" font-weight="700">Query</text>
  <rect x="12" y="398" width="366" height="306" rx="14" class="island"/><text x="28" y="426" class="label">Editor</text><rect x="28" y="438" width="334" height="150" rx="8" class="soft"/><text x="44" y="468" font-family="monospace" font-size="11" fill="#7e22ce">SELECT ?s ?p ?o</text><text x="44" y="488" font-family="monospace" font-size="11">WHERE { ?s ?p ?o }</text><text x="44" y="508" font-family="monospace" font-size="11" fill="#2563eb">LIMIT 100</text><rect x="28" y="610" width="100" height="36" rx="8" class="primary"/><text x="49" y="633" fill="#fff" class="small" font-weight="700">Execute</text><rect x="138" y="610" width="116" height="36" rx="8" class="island"/><text x="151" y="633" class="small">Explain Query</text><rect x="264" y="610" width="98" height="36" rx="8" class="island"/><text x="280" y="633" class="small">Options  v</text><text x="28" y="678" class="small muted">Save query  v</text>
  <rect x="12" y="728" width="366" height="446" rx="14" class="island"/><text x="28" y="758" font-size="20" font-weight="700">Query Result</text><rect x="28" y="778" width="142" height="34" rx="8" class="island"/><text x="46" y="800" class="small">Download  v</text><rect x="182" y="778" width="164" height="34" rx="8" class="island"/><text x="198" y="800" class="small">Result options  v</text><rect x="216" y="822" width="62" height="32" rx="8" class="soft"/><text x="224" y="843" class="small muted">Prev.</text><rect x="284" y="822" width="62" height="32" rx="8" class="island"/><text x="298" y="843" class="small" font-weight="700">Next</text><rect x="28" y="872" width="334" height="218" rx="8" class="soft"/><rect x="28" y="872" width="334" height="34" fill="#e2e8f0"/><text x="42" y="894" class="small" font-weight="700">s</text><text x="158" y="894" class="small" font-weight="700">p</text><text x="274" y="894" class="small" font-weight="700">o</text><line x1="144" y1="872" x2="144" y2="1090" class="rule"/><line x1="260" y1="872" x2="260" y2="1090" class="rule"/><text x="42" y="930" class="small blue">urn:person:1</text><text x="158" y="930" class="small blue">urn:foaf:name</text><text x="274" y="930" class="small">"Alice"</text><line x1="28" y1="944" x2="362" y2="944" class="rule"/><text x="42" y="970" class="small blue">urn:person:2</text><text x="158" y="970" class="small blue">urn:foaf:mbox</text><text x="274" y="970" class="small">"alice@..."</text><line x1="28" y1="984" x2="362" y2="984" class="rule"/><text x="42" y="1010" class="small blue">urn:person:3</text><text x="158" y="1010" class="small blue">urn:foaf:knows</text><text x="274" y="1010" class="small blue">urn:p:3</text><text x="28" y="1126" class="small muted">Table overflow stays inside the result surface.</text>
  <rect x="14" y="1190" width="362" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="28" y="1212" class="small" font-weight="700">Loading / error status</text><text x="28" y="1230" class="small muted">stays above the result frame; Cancel remains beside actions.</text>
  <text x="14" y="1278" class="small muted">Wire: wrapped nav · full-width content · internal table scroll</text>
</svg>
