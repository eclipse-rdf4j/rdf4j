<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="title desc">
  <title id="title">RDF4J Workbench query disclosures expanded wire</title>
  <desc id="desc">Expanded options state showing existing query, save, download, result limit and datatype controls in their current forms.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; } .small { font-size: 13px; } .label { font-size: 15px; font-weight: 700; } .muted { fill: #475569; } .rule { stroke: #cbd5e1; } .island { fill: #fff; stroke: #e2e8f0; } .soft { fill: #f8fafc; stroke: #cbd5e1; } .primary { fill: #0f172a; } .blue { fill: #2563eb; } .inverse { fill: #fff; }
    text[fill="#fff"] { fill: #fff; }
  </style>
  <rect width="980" height="760" fill="#f1f5f9"/><text x="32" y="42" font-size="25" font-weight="700">Query · expanded controls</text>
  <rect x="32" y="66" width="916" height="332" rx="14" class="island"/><rect x="56" y="94" width="868" height="126" rx="8" class="soft"/><text x="72" y="124" font-family="monospace" font-size="14" fill="#7e22ce">SELECT ?s ?p ?o WHERE { ?s ?p ?o }</text>
  <rect x="56" y="240" width="130" height="38" rx="8" class="primary"/><text x="82" y="264" fill="#fff" class="small" font-weight="700">Execute</text><rect x="198" y="240" width="134" height="38" rx="8" class="island"/><text x="222" y="264" class="small">Explain Query</text>
  <line x1="56" y1="294" x2="924" y2="294" class="rule"/><text x="56" y="320" class="label">Options</text><text x="160" y="320" class="small muted">Results per page</text><rect x="278" y="300" width="74" height="30" rx="8" class="soft"/><text x="294" y="320" class="small">100 v</text><text x="374" y="320" class="small muted">Timeout</text><rect x="430" y="300" width="74" height="30" rx="8" class="soft"/><text x="448" y="320" class="small">0</text><rect x="530" y="308" width="14" height="14" rx="3" class="primary"/><text x="554" y="320" class="small">Include inferred</text><rect x="56" y="344" width="84" height="34" rx="8" class="island"/><text x="76" y="366" class="small">Clear</text><text x="160" y="366" class="label">Save query</text><rect x="254" y="344" width="194" height="34" rx="8" class="soft"/><text x="270" y="366" class="small muted">Query name</text><rect x="462" y="344" width="14" height="14" rx="3" class="soft"/><text x="486" y="366" class="small">Save privately</text>
  <rect x="32" y="422" width="916" height="260" rx="14" class="island"/><text x="56" y="456" font-size="20" font-weight="700">Query Result</text><text x="56" y="486" class="label">Download</text><rect x="150" y="468" width="110" height="32" rx="8" class="soft"/><text x="166" y="489" class="small">CSV v</text><text x="276" y="489" class="small">Limit 100</text><rect x="364" y="468" width="98" height="32" rx="8" class="primary"/><text x="386" y="489" fill="#fff" class="small">Download</text><text x="56" y="536" class="label">Result options</text><text x="190" y="536" class="small muted">Results per page 100 · Show datatypes</text><rect x="730" y="516" width="90" height="32" rx="8" class="soft"/><text x="748" y="537" class="small">Previous</text><rect x="830" y="516" width="90" height="32" rx="8" class="island"/><text x="854" y="537" class="small">Next</text><rect x="56" y="568" width="864" height="82" rx="8" class="soft"/><text x="72" y="594" class="small" font-weight="700">s</text><text x="350" y="594" class="small" font-weight="700">p</text><text x="628" y="594" class="small" font-weight="700">o</text><text x="72" y="622" class="small blue">urn:person:1</text><text x="350" y="622" class="small blue">urn:foaf:name</text><text x="628" y="622" class="small">"Alice"</text>
</svg>
