# Default RDF4J Server HTTP port.
# Override by exporting RDF4J_SERVER_PORT or editing this file before running bin/rdf4j-server.sh.
server.port=${RDF4J_SERVER_PORT:8080}

# Server and Workbench bind to 127.0.0.1 by default.
# To listen on all IPv4 interfaces, uncomment this line or export SERVER_ADDRESS=0.0.0.0.
# server.address=0.0.0.0

# Spring-boot Actuator is disabled by default
management.server.port=-1
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.exclude=*

# Keep existing classpath defaults (e.g. bean definition overriding) by loading this file via
# spring.config.additional-location rather than replacing the built-in configuration.
