<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts for end-to-end tests on Linux. The layout and spacing specs measure rendered geometry, so the generic
  families resolve to the Liberation fonts (metric-compatible with Arial and Courier New, installed with the
  Playwright browser dependencies) instead of whatever the host prefers (for example DejaVu Sans on CI runners).
  run.sh points FONTCONFIG_FILE at this file; the system configuration is included first.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
