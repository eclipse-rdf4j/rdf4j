junit.jupiter.tempdir.cleanup.mode.default=always
# Global per-test-method timeout so a hung evaluation fails the test (via watchdog interruption)
# instead of wedging the whole surefire fork for hours (2026-08-22: LmdbNativeDifferentialFuzzTest
# hung >3.5h with zero tests completed). SAME_THREAD mode keeps LMDB's thread-affinity expectations
# intact; individual tests may declare tighter @Timeout values.
junit.jupiter.execution.timeout.testable.method.default=15 m
# Lifecycle methods (@BeforeEach/@AfterEach/...) get their own bound: a leaked resource that wedges a
# store shutdown in @AfterEach must fail the test, not the whole fork.
junit.jupiter.execution.timeout.lifecycle.method.default=5 m
