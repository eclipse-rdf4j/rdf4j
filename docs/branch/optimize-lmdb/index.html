let current=0;
const stage=document.getElementById('stage'),scroller=document.getElementById('stageScroll');
function chapterMarkup(c,i,print=false){return '<div class="eyebrow"><span class="section">'+c.group+'</span><span class="rule"></span><span>Chapter '+String(i+1).padStart(2,'0')+' / 20</span></div><div class="chapter-top"><h1 class="chapter-title" id="'+(print?'print-title-'+i:'chapterTitle')+'">'+c.title+'</h1><p class="lead">'+c.lead+'</p></div><div class="takeaway">'+c.takeaway+'</div><div class="visual">'+visual(c,print)+'</div>'+(print?'<div class="detail-body">'+c.details+'</div>':'<div class="details-row"><details class="deep-dive"><summary>What changed, why, and where it stops</summary><div class="detail-body">'+c.details+'</div></details><button class="source-button" data-sources aria-haspopup="dialog">Sources & reading ↗</button></div>');}
function render(updateHash=false,focus=false) {
  const c = chapters[current];
  stage.className = 'stage ' + (c.dense ? 'dense' : '');
  stage.innerHTML = chapterMarkup(c,current);
  stage.style.animation = 'none';
  void stage.offsetWidth;
  stage.style.animation = '';
  scroller.scrollTop = 0;
  document.title = c.short + ' — optimize-lmdb / RDF4J';
  document.querySelectorAll('.chapter-link').forEach((button,i) => {
    if (i === current) button.setAttribute('aria-current','step');
    else button.removeAttribute('aria-current');
  });
  // Keep the current chapter visible after history, hash or keyboard navigation.
  const nav = document.querySelector('.rail');
  const active = nav.querySelector('[aria-current="step"]');
  if (nav.offsetParent && active) {
    const bounds = nav.getBoundingClientRect();
    const item = active.getBoundingClientRect();
    if (item.top < bounds.top + 10) nav.scrollTop -= bounds.top + 10 - item.top;
    else if (item.bottom > bounds.bottom - 10) nav.scrollTop += item.bottom - bounds.bottom + 10;
  }
  document.getElementById('progressCount').innerHTML =
    '<strong>' + String(current+1).padStart(2,'0') + '</strong> / 20';
  document.getElementById('progressTrack').innerHTML = chapters.map((_,i) =>
    '<span class="' + (i <= current ? 'visited' : '') + '"></span>'
  ).join('');
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === chapters.length-1;
  document.getElementById('nextLabel').textContent = current === chapters.length-1 ? 'Complete' : 'Next';
  document.getElementById('mobileChapters').textContent = String(current+1).padStart(2,'0') + ' / Chapters ↗';
  if (updateHash && location.hash !== '#' + c.id) history.pushState({chapter:current},'','#' + c.id);
  if (focus) scroller.focus({preventScroll:true});
}
function go(i,focus=true){if(i<0||i>=chapters.length)return;current=i;render(true,focus);}
const rail=document.getElementById('chapterRail');let lastGroup='';rail.innerHTML=chapters.map((c,i)=>{const group=c.group!==lastGroup?'<div class="group-label">'+c.group+'</div>':'';lastGroup=c.group;return group+'<button class="chapter-link" data-chapter="'+i+'"><span class="nav-number">'+String(i+1).padStart(2,'0')+'</span><span>'+c.short+'</span></button>'}).join('');
function refreshVisual() {
  const active = document.activeElement;
  const controlAttribute = ['data-pipeline','data-lookup','data-join'].find(name => active?.hasAttribute(name));
  const controlValue = controlAttribute ? active.getAttribute(controlAttribute) : null;
  stage.querySelector('.visual').innerHTML = visual(chapters[current]);
  if (controlAttribute) {
    stage.querySelector('[' + controlAttribute + '="' + controlValue + '"]')?.focus({preventScroll:true});
  }
  // A step should expose its explanation even in a short viewport.
  // Adjust only as much as needed, so repeated choices do not move the page.
  const output = stage.querySelector('.demo-output');
  if (output) {
    const view = scroller.getBoundingClientRect();
    const result = output.getBoundingClientRect();
    if (result.bottom > view.bottom - 18) scroller.scrollTop += result.bottom - view.bottom + 18;
    else if (result.top < view.top + 18) scroller.scrollTop -= view.top + 18 - result.top;
  }
}
function refreshRoute() {
  const d = routeDescription();
  const result = stage.querySelector('.route-result');
  if (!result) return;
  result.querySelector('h3').textContent = d[0];
  result.querySelector('p').textContent = d[1];
  result.querySelector('.route-list').innerHTML =
    'Graph access: ' + (routeState.adjacency ? 'covered adjacency + durable fallback' : 'durable statement indexes') +
    '<br>Value resolution: ' + (routeState.overlay ? 'covered overlay + durable fallback' : 'durable value dictionary') +
    '<br>Policy: ' + (routeState.experimental ? 'experimental policy gate enabled' : 'default query policy');
}
function showSources(){const c=chapters[current];document.getElementById('sourceContent').innerHTML='<div class="eyebrow">'+c.group+' · '+String(current+1).padStart(2,'0')+'</div><h3 class="source-title">'+c.short+'</h3><p class="source-intro">Implementation links are pinned to source commit <code>9d17a49841</code>. Local guides provide further detail; their older comparison figures are historical.</p>'+c.sources.map(s=>'<a class="source-link" href="'+(s.local?s.path:GITHUB+s.path)+'" '+(s.local?'':'target="_blank" rel="noopener"')+'><strong>'+esc(s.name)+' ↗</strong><span>'+esc(s.note)+' · '+esc(s.path)+'</span></a>').join('')+'<p class="source-note">Source tests describe contracts. This presentation does not claim a current RDF4J test run. Mechanism, rationale and limitations are source-based explanations; examples are illustrative.</p>';document.getElementById('sourceDialog').showModal();}
function searchChapters(){const q=document.getElementById('chapterSearch').value.trim().toLowerCase();const matches=chapters.map((c,i)=>({c,i})).filter(x=>(x.c.short+' '+x.c.title.replace(/<[^>]+>/g,'')+' '+x.c.group+' '+x.c.keywords).toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=matches.length?matches.map(({c,i})=>'<button class="search-item" data-search-chapter="'+i+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+c.short+'<small>'+c.group+'</small></span></button>').join(''):'<p class="empty-results">No matching chapter. Try a broader term.</p>';}
function openNavigator(){document.getElementById('chapterSearch').value='';searchChapters();document.getElementById('chapterDialog').showModal();document.getElementById('chapterSearch').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-chapter'))go(Number(b.dataset.chapter));else if(b.hasAttribute('data-search-chapter')){document.getElementById('chapterDialog').close();go(Number(b.dataset.searchChapter));}else if(b.hasAttribute('data-pipeline')){pipelineStep=Number(b.dataset.pipeline);refreshVisual();}else if(b.hasAttribute('data-lookup')){lookupStep=Number(b.dataset.lookup);refreshVisual();}else if(b.hasAttribute('data-join')){joinStep=Number(b.dataset.join);refreshVisual();}else if(b.hasAttribute('data-sources'))showSources();else if(b.hasAttribute('data-close'))document.getElementById(b.dataset.close).close();});
document.addEventListener('change',e=>{if(e.target.matches('[data-toggle]')){routeState[e.target.dataset.toggle]=e.target.checked;refreshRoute();}else if(e.target.id==='routeShape'){routeState.shape=e.target.value;refreshRoute();}});
document.getElementById('prev').addEventListener('click',()=>go(current-1));document.getElementById('next').addEventListener('click',()=>go(current+1));
document.getElementById('openChapters').addEventListener('click',openNavigator);document.getElementById('mobileChapters').addEventListener('click',openNavigator);document.getElementById('chapterSearch').addEventListener('input',searchChapters);
document.getElementById('printButton').addEventListener('click',()=>window.print());
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,button,a,summary,[contenteditable]'))return;let i=current;if(e.key==='ArrowRight')i++;else if(e.key==='ArrowLeft')i--;else if(e.key==='Home')i=0;else if(e.key==='End')i=chapters.length-1;else return;e.preventDefault();go(i);});
function fromHash(){let id=location.hash.slice(1);try{id=decodeURIComponent(id);}catch{ /* Malformed external hashes simply open the first chapter. */ }const i=chapters.findIndex(c=>c.id===id);current=i<0?0:i;render(false);}
window.addEventListener('popstate',fromHash);window.addEventListener('hashchange',fromHash);
function buildPrint(){document.getElementById('printPages').innerHTML='<section class="print-front"><div class="eyebrow">RDF4J · BRANCH FIELD GUIDE</div><h1>optimize-lmdb<br>Same graph. A different path.</h1><p>A source-based developer guide across storage, execution and operating contracts. Source snapshot <code>'+HEAD+'</code>, reviewed 2026-10-08. No RDF4J code was built or run for this guide. Interactive diagrams are illustrations, not measurements.</p></section>'+chapters.map((c,i)=>'<section class="print-chapter '+(c.dense?'dense':'')+'">'+chapterMarkup(c,i,true)+'<div class="source-print">Sources: '+c.sources.map(s=>'<a href="'+(s.local?s.path:GITHUB+s.path)+'">'+esc(s.name)+'</a>').join(' · ')+'</div></section>').join('');}
window.addEventListener('beforeprint',buildPrint);
fromHash();buildPrint();
</script>
</body>
</html>
