version: '2'
services:
  rdf4j:
    environment:
      - APP_LOGGING_LEVEL=${APP_LOGGING_LEVEL}
      - APP_SERVER=${APP_SERVER:-tomcat}
      # set OTEL_EXPORTER_OTLP_ENDPOINT to enable OpenTelemetry tracing, e.g. http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-rdf4j-server}
    ports:
      - 127.0.0.1:8080:8080
    build:
      context: .
      dockerfile: Dockerfile-${APP_SERVER:-tomcat}
    restart: always
    volumes:
      - rdf4j_data:/var/rdf4j
      - rdf4j_logs:/usr/local/${APP_SERVER:-tomcat}/logs

volumes:
  rdf4j_data:
  rdf4j_logs:
